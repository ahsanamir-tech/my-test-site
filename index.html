<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Orbit | Claude to Vercel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle at top left, #1a1a2e, #16213e); }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center font-sans">
    <div class="glass p-12 rounded-3xl shadow-2xl text-center max-w-md mx-4 transition-all hover:scale-105 duration-500">
        <div class="w-20 h-20 bg-blue-500 rounded-full mx-auto mb-6 flex items-center justify-center animate-bounce shadow-[0_0_30px_rgba(59,130,246,0.5)]">
            <span class="text-3xl">🚀</span>
        </div>
        <h1 class="text-4xl font-bold mb-4 tracking-tight">System Online</h1>
        <p class="text-blue-200 text-lg mb-8 leading-relaxed">
            This is a test site generated by <span class="font-mono bg-blue-900 px-2 py-1 rounded text-sm text-white">Claude</span> 
            and hosted on <span class="font-mono bg-white px-2 py-1 rounded text-sm text-black">Vercel</span>.
        </p>
        <div class="flex gap-4 justify-center">
            <div class="h-2 w-2 rounded-full bg-green-400 animate-pulse"></div>
            <span class="text-xs uppercase tracking-widest text-blue-300">Deployment Successful</span>
        </div>
    </div>
</body>
</html>
